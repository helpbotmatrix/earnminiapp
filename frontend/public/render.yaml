services:
  - type: web
    name: earnminiapp-frontend
    runtime: static
    branch: gh-pages
    buildCommand: echo "Deploying prebuilt static site"
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
