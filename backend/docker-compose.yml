services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: earnminiapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: earnminiapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d earnminiapp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Redis In-Memory Cache & Leaderboard
  redis:
    image: redis:7-alpine
    container_name: earnminiapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. EarnMiniApp Go Backend Engine
  backend:
    image: gojo16s/earnminiapp-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: earnminiapp_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./wallet.json:/app/wallet.json
    env_file:
      - .env

  # 4. Watchtower (Auto Pull & Restart on new image push)
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup earnminiapp_backend

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
